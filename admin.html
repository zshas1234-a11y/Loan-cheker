<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel — Loan Control Center</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0f172a; color: #f8fafc; }
    .admin-card { background: #1e293b; border: 1px solid #334155; }
  </style>
</head>
<body class="min-h-screen">

  <!-- ADMIN LOGIN SECTION -->
  <div id="adminLoginSection" class="min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md admin-card p-8 rounded-3xl shadow-2xl">
      <div class="text-center mb-6">
        <div class="w-16 h-16 bg-blue-600/20 border border-blue-500/40 rounded-2xl mx-auto flex items-center justify-center text-blue-400 text-2xl mb-3">
          <i class="fa-solid fa-user-shield"></i>
        </div>
        <h2 class="text-2xl font-black text-white">Admin Control Login</h2>
        <p class="text-slate-400 text-xs mt-1">Authorized Management Personnel Only</p>
      </div>

      <form onsubmit="handleAdminLogin(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-300 uppercase mb-1">Username</label>
          <input type="text" id="adminUser" value="admin" class="w-full p-3 rounded-xl bg-slate-900 border border-slate-700 text-white outline-none focus:border-blue-500 text-sm">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-300 uppercase mb-1">Password</label>
          <input type="password" id="adminPass" placeholder="Enter admin password" class="w-full p-3 rounded-xl bg-slate-900 border border-slate-700 text-white outline-none focus:border-blue-500 text-sm" required>
        </div>
        <div id="loginError" class="hidden text-xs text-red-400 font-bold text-center">
          Invalid Admin Credentials!
        </div>
        <button type="submit" class="w-full py-3 bg-blue-600 hover:bg-blue-500 rounded-xl font-extrabold text-white transition shadow-lg shadow-blue-600/30">
          LOGIN TO ADMIN PANEL
        </button>
      </form>
    </div>
  </div>

  <!-- ADMIN DASHBOARD CONTAINER (HIDDEN) -->
  <div id="adminDashboard" class="hidden min-h-screen flex flex-col">
    <header class="bg-slate-900 border-b border-slate-800 p-4">
      <div class="max-w-7xl mx-auto flex justify-between items-center">
        <div class="flex items-center space-x-3">
          <span class="p-2 bg-blue-600 rounded-lg text-white font-black"><i class="fa-solid fa-gear"></i></span>
          <h1 class="font-extrabold text-lg text-white">ADMIN PORTAL MANAGER</h1>
        </div>
        <button onclick="adminLogout()" class="px-3 py-1.5 bg-red-500/20 border border-red-500/40 text-red-400 hover:bg-red-500 hover:text-white rounded-lg text-xs font-bold transition">
          <i class="fa-solid fa-power-off mr-1"></i> Logout
        </button>
      </div>
    </header>

    <main class="max-w-7xl mx-auto w-full p-4 sm:p-6 space-y-6 flex-grow">
      
      <!-- SETTINGS & ADD LOAN GRID -->
      <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <!-- SETTINGS: PAYMENT ACCOUNTS -->
        <div class="admin-card p-6 rounded-2xl">
          <h3 class="text-sm font-extrabold text-white uppercase tracking-wider mb-4 flex items-center gap-2">
            <i class="fa-solid fa-wallet text-blue-400"></i> Admin Payment Numbers
          </h3>
          <form onsubmit="saveAccounts(event)" class="space-y-3 text-xs">
            <div>
              <label class="block text-slate-400 font-bold mb-1">EasyPaisa Number</label>
              <input type="text" id="accEasyPaisa" class="w-full p-2.5 rounded-lg bg-slate-900 border border-slate-700 text-emerald-400 font-mono font-bold">
            </div>
            <div>
              <label class="block text-slate-400 font-bold mb-1">JazzCash Number</label>
              <input type="text" id="accJazzCash" class="w-full p-2.5 rounded-lg bg-slate-900 border border-slate-700 text-red-400 font-mono font-bold">
            </div>
            <div>
              <label class="block text-slate-400 font-bold mb-1">SadaPay Number</label>
              <input type="text" id="accSadaPay" class="w-full p-2.5 rounded-lg bg-slate-900 border border-slate-700 text-teal-300 font-mono font-bold">
            </div>
            <button type="submit" class="w-full py-2 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-lg transition mt-2">
              Save Payment Numbers
            </button>
          </form>
        </div>

        <!-- ADD NEW CUSTOMER LOAN -->
        <div class="admin-card p-6 rounded-2xl lg:col-span-2">
          <h3 class="text-sm font-extrabold text-white uppercase tracking-wider mb-4 flex items-center gap-2">
            <i class="fa-solid fa-user-plus text-blue-400"></i> Add New Loan Record
          </h3>
          <form onsubmit="addLoanRecord(event)" class="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">
            <div>
              <label class="block text-slate-400 font-bold mb-1">Customer Full Name</label>
              <input type="text" id="newCustName" placeholder="e.g. Zahid Khan" class="w-full p-2.5 rounded-lg bg-slate-900 border border-slate-700 text-white" required>
            </div>
            <div>
              <label class="block text-slate-400 font-bold mb-1">6-Digit Passcode (Code)</label>
              <input type="text" id="newCustCode" maxlength="6" placeholder="e.g. 123456" class="w-full p-2.5 rounded-lg bg-slate-900 border border-slate-700 text-amber-400 font-bold font-mono" required>
            </div>
            <div>
              <label class="block text-slate-400 font-bold mb-1">Approved Loan Amount (PKR)</label>
              <input type="number" id="newLoanAmt" placeholder="100000" class="w-full p-2.5 rounded-lg bg-slate-900 border border-slate-700 text-white" required>
            </div>
            <div>
              <label class="block text-slate-400 font-bold mb-1">Total Payable Amount (PKR)</label>
              <input type="number" id="newPayableAmt" placeholder="120000" class="w-full p-2.5 rounded-lg bg-slate-900 border border-slate-700 text-white" required>
            </div>
            <div>
              <label class="block text-slate-400 font-bold mb-1">Approval Date</label>
              <input type="date" id="newAppDate" class="w-full p-2.5 rounded-lg bg-slate-900 border border-slate-700 text-white" required>
            </div>
            <div>
              <label class="block text-slate-400 font-bold mb-1">Next Payment Due Date</label>
              <input type="date" id="newDueDate" class="w-full p-2.5 rounded-lg bg-slate-900 border border-slate-700 text-white" required>
            </div>
            <div class="sm:col-span-2">
              <button type="submit" class="w-full py-2.5 bg-blue-600 hover:bg-blue-500 font-extrabold text-white rounded-lg transition">
                CREATE & SAVE LOAN RECORD
              </button>
            </div>
          </form>
        </div>

      </div>

      <!-- LOAN RECORDS LIST -->
      <div class="admin-card p-6 rounded-2xl">
        <h3 class="text-sm font-extrabold text-white uppercase tracking-wider mb-4 flex items-center gap-2">
          <i class="fa-solid fa-list-check text-blue-400"></i> Active Registered Loans
        </h3>
        <div class="overflow-x-auto">
          <table class="w-full text-left text-xs">
            <thead class="bg-slate-900 text-slate-400 uppercase">
              <tr>
                <th class="p-3">Loan ID</th>
                <th class="p-3">6-Digit Code</th>
                <th class="p-3">Customer</th>
                <th class="p-3">Total Payable</th>
                <th class="p-3">Paid Amount</th>
                <th class="p-3">Remaining</th>
                <th class="p-3 text-right">Actions</th>
              </tr>
            </thead>
            <tbody id="adminLoanTable" class="divide-y divide-slate-800">
              <!-- Dynamic Rows -->
            </tbody>
          </table>
        </div>
      </div>

    </main>
  </div>

  <script>
    const ADMIN_PASS = 'admin100'; // Admin password as requested

    function handleAdminLogin(e) {
      e.preventDefault();
      const user = document.getElementById('adminUser').value;
      const pass = document.getElementById('adminPass').value;

      if(user === 'admin' && pass === ADMIN_PASS) {
        document.getElementById('adminLoginSection').classList.add('hidden');
        document.getElementById('adminDashboard').classList.remove('hidden');
        loadAdminData();
      } else {
        document.getElementById('loginError').classList.remove('hidden');
      }
    }

    function adminLogout() {
      document.getElementById('adminDashboard').classList.add('hidden');
      document.getElementById('adminLoginSection').classList.remove('hidden');
      document.getElementById('adminPass').value = '';
    }

    function loadAdminData() {
      // Accounts
      const accounts = JSON.parse(localStorage.getItem('portal_payment_accounts') || '{"easypaisa":"03001234567","jazzcash":"03007654321","sadapay":"03001122334"}');
      document.getElementById('accEasyPaisa').value = accounts.easypaisa;
      document.getElementById('accJazzCash').value = accounts.jazzcash;
      document.getElementById('accSadaPay').value = accounts.sadapay;

      // Loans Table
      const loans = JSON.parse(localStorage.getItem('portal_loans') || '[]');
      const tbody = document.getElementById('adminLoanTable');
      tbody.innerHTML = '';

      loans.forEach((l, idx) => {
        const rem = l.payableAmount - l.paidAmount;
        const row = `
          <tr class="hover:bg-slate-800/50">
            <td class="p-3 font-mono font-bold text-blue-400">${l.loanId}</td>
            <td class="p-3 font-mono font-extrabold text-amber-400 bg-amber-500/10 rounded px-2">${l.code}</td>
            <td class="p-3 font-bold text-white">${l.customerName}</td>
            <td class="p-3 font-bold text-slate-300">Rs. ${l.payableAmount.toLocaleString()}</td>
            <td class="p-3 font-bold text-emerald-400">Rs. ${l.paidAmount.toLocaleString()}</td>
            <td class="p-3 font-bold text-rose-400">Rs. ${rem.toLocaleString()}</td>
            <td class="p-3 text-right space-x-2">
              <button onclick="addPaymentPrompt(${idx})" class="px-2 py-1 bg-emerald-600/30 text-emerald-300 border border-emerald-500/40 hover:bg-emerald-600 hover:text-white rounded text-[11px] font-bold">
                + Add Payment
              </button>
              <button onclick="deleteLoan(${idx})" class="px-2 py-1 bg-red-600/30 text-red-300 border border-red-500/40 hover:bg-red-600 hover:text-white rounded text-[11px] font-bold">
                Delete
              </button>
            </td>
          </tr>
        `;
        tbody.innerHTML += row;
      });
    }

    function saveAccounts(e) {
      e.preventDefault();
      const accounts = {
        easypaisa: document.getElementById('accEasyPaisa').value,
        jazzcash: document.getElementById('accJazzCash').value,
        sadapay: document.getElementById('accSadaPay').value
      };
      localStorage.setItem('portal_payment_accounts', JSON.stringify(accounts));
      alert('Payment Accounts updated successfully!');
    }

    function addLoanRecord(e) {
      e.preventDefault();
      const loans = JSON.parse(localStorage.getItem('portal_loans') || '[]');
      const newLoan = {
        loanId: 'LCN-' + Math.floor(1000 + Math.random() * 9000),
        code: document.getElementById('newCustCode').value,
        customerName: document.getElementById('newCustName').value,
        totalLoan: parseFloat(document.getElementById('newLoanAmt').value),
        payableAmount: parseFloat(document.getElementById('newPayableAmt').value),
        paidAmount: 0,
        approvalDate: document.getElementById('newAppDate').value,
        nextDueDate: document.getElementById('newDueDate').value,
        status: 'Active',
        installments: []
      };

      loans.push(newLoan);
      localStorage.setItem('portal_loans', JSON.stringify(loans));
      alert('New Loan Added Successfully!');
      loadAdminData();
    }

    function addPaymentPrompt(index) {
      const loans = JSON.parse(localStorage.getItem('portal_loans') || '[]');
      const amount = prompt("Enter payment amount collected (PKR):");
      if(amount && !isNaN(amount)) {
        loans[index].paidAmount += parseFloat(amount);
        loans[index].installments.push({
          num: loans[index].installments.length + 1,
          dueDate: new Date().toISOString().split('T')[0],
          amount: parseFloat(amount),
          paidDate: new Date().toISOString().split('T')[0],
          status: 'PAID'
        });
        localStorage.setItem('portal_loans', JSON.stringify(loans));
        loadAdminData();
      }
    }

    function deleteLoan(index) {
      if(confirm("Are you sure you want to delete this loan record?")) {
        const loans = JSON.parse(localStorage.getItem('portal_loans') || '[]');
        loans.splice(index, 1);
        localStorage.setItem('portal_loans', JSON.stringify(loans));
        loadAdminData();
      }
    }
  </script>
</body>
</html>
