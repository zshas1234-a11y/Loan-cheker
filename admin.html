<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel — Loan Control Center</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0f172a; color: #f8fafc; }
    .admin-card { background: #1e293b; border: 1px solid #334155; }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

  <!-- ADMIN LOGIN SECTION -->
  <div id="adminLoginSection" class="min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md admin-card p-8 rounded-3xl shadow-2xl">
      <div class="text-center mb-6">
        <div class="w-16 h-16 bg-blue-600/20 border border-blue-500/40 rounded-2xl mx-auto flex items-center justify-center text-blue-400 text-2xl mb-3">
          <i class="fa-solid fa-user-shield"></i>
        </div>
        <h2 class="text-2xl font-black text-white">Admin Cloud Login</h2>
        <p class="text-slate-400 text-xs mt-1">Password: <strong class="text-amber-400">admin100</strong></p>
      </div>

      <form onsubmit="handleAdminLogin(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-300 uppercase mb-1">Username</label>
          <input type="text" id="adminUser" value="admin" class="w-full p-3 rounded-xl bg-slate-900 border border-slate-700 text-white outline-none focus:border-blue-500 text-sm" required>
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-300 uppercase mb-1">Password</label>
          <input type="password" id="adminPass" placeholder="Enter password" class="w-full p-3 rounded-xl bg-slate-900 border border-slate-700 text-white outline-none focus:border-blue-500 text-sm" required>
        </div>
        <div id="loginError" class="hidden p-3 rounded-xl bg-red-500/10 border border-red-500/30 text-xs text-red-400 font-bold text-center">
          <i class="fa-solid fa-triangle-exclamation mr-1"></i> Incorrect Password! Use admin100.
        </div>
        <button type="submit" class="w-full py-3 bg-blue-600 hover:bg-blue-500 rounded-xl font-extrabold text-white transition shadow-lg shadow-blue-600/30">
          LOGIN TO ADMIN PANEL
        </button>
      </form>
    </div>
  </div>

  <!-- ADMIN DASHBOARD CONTAINER -->
  <div id="adminDashboard" class="hidden min-h-screen flex flex-col">
    <header class="bg-slate-900 border-b border-slate-800 p-4 sticky top-0 z-50">
      <div class="max-w-7xl mx-auto flex justify-between items-center">
        <div class="flex items-center space-x-3">
          <span class="p-2 bg-blue-600 rounded-lg text-white font-black"><i class="fa-solid fa-cloud"></i></span>
          <h1 class="font-extrabold text-lg text-white">ADMIN CLOUD MANAGER</h1>
        </div>
        <button onclick="adminLogout()" class="px-3 py-1.5 bg-red-500/20 border border-red-500/40 text-red-400 hover:bg-red-500 hover:text-white rounded-lg text-xs font-bold transition">
          <i class="fa-solid fa-power-off mr-1"></i> Logout
        </button>
      </div>
    </header>

    <main class="max-w-7xl mx-auto w-full p-4 sm:p-6 space-y-6 flex-grow">
      
      <!-- LIVE ACTIVITY & ERROR LOG PANEL -->
      <div class="admin-card p-5 rounded-2xl border-l-4 border-l-cyan-500 shadow-xl" id="logSection">
        <div class="flex justify-between items-center mb-3">
          <h3 class="text-xs font-extrabold text-cyan-400 uppercase tracking-wider flex items-center gap-2">
            <i class="fa-solid fa-terminal"></i> Live System Logs & Error Tracer
          </h3>
          <button onclick="clearLogs()" class="text-[10px] bg-slate-800 hover:bg-slate-700 text-slate-300 px-2.5 py-1 rounded border border-slate-700 transition">Clear Logs</button>
        </div>
        <div id="activityLogContainer" class="bg-slate-950 rounded-xl p-3 h-28 overflow-y-auto space-y-1.5 font-mono text-[11px] border border-slate-800">
          <div class="text-slate-500">[System] Initializing Firebase connection...</div>
        </div>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <!-- PAYMENT ACCOUNTS -->
        <div class="admin-card p-6 rounded-2xl shadow-xl">
          <h3 class="text-sm font-extrabold text-white uppercase tracking-wider mb-4 flex items-center gap-2">
            <i class="fa-solid fa-wallet text-blue-400"></i> Payment Numbers
          </h3>
          <form onsubmit="saveAccounts(event)" class="space-y-3 text-xs">
            <div>
              <label class="block text-slate-400 font-bold mb-1">EasyPaisa</label>
              <input type="text" id="accEasyPaisa" class="w-full p-2.5 rounded-lg bg-slate-900 border border-slate-700 text-emerald-400 font-mono font-bold" required>
            </div>
            <div>
              <label class="block text-slate-400 font-bold mb-1">JazzCash</label>
              <input type="text" id="accJazzCash" class="w-full p-2.5 rounded-lg bg-slate-900 border border-slate-700 text-red-400 font-mono font-bold" required>
            </div>
            <div>
              <label class="block text-slate-400 font-bold mb-1">SadaPay</label>
              <input type="text" id="accSadaPay" class="w-full p-2.5 rounded-lg bg-slate-900 border border-slate-700 text-teal-300 font-mono font-bold" required>
            </div>
            <button type="submit" id="saveAccBtn" class="w-full py-2 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-lg transition mt-2">
              Save Numbers
            </button>
          </form>
        </div>

        <!-- ADD NEW LOAN RECORD -->
        <div class="admin-card p-6 rounded-2xl lg:col-span-2 shadow-xl">
          <h3 class="text-sm font-extrabold text-white uppercase tracking-wider mb-4 flex items-center gap-2">
            <i class="fa-solid fa-user-plus text-blue-400"></i> Add New Loan Record
          </h3>
          <form onsubmit="addLoanRecord(event)" class="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">
            <div>
              <label class="block text-slate-400 font-bold mb-1">Customer Full Name</label>
              <input type="text" id="newCustName" placeholder="e.g. Brahumdagh" class="w-full p-2.5 rounded-lg bg-slate-900 border border-slate-700 text-white" required>
            </div>
            <div>
              <label class="block text-slate-400 font-bold mb-1">6-Digit Passcode</label>
              <input type="text" id="newCustCode" maxlength="6" placeholder="e.g. 888890" class="w-full p-2.5 rounded-lg bg-slate-900 border border-slate-700 text-amber-400 font-bold font-mono" required>
            </div>
            <div>
              <label class="block text-slate-400 font-bold mb-1">Approved Loan Amount (PKR)</label>
              <input type="number" id="newLoanAmt" placeholder="140000" class="w-full p-2.5 rounded-lg bg-slate-900 border border-slate-700 text-white" required>
            </div>
            <div>
              <label class="block text-slate-400 font-bold mb-1">Total Payable Amount (PKR)</label>
              <input type="number" id="newPayableAmt" placeholder="140000" class="w-full p-2.5 rounded-lg bg-slate-900 border border-slate-700 text-white" required>
            </div>
            <div>
              <label class="block text-slate-400 font-bold mb-1">Approval Date</label>
              <input type="date" id="newAppDate" class="w-full p-2.5 rounded-lg bg-slate-900 border border-slate-700 text-white" required>
            </div>
            <div>
              <label class="block text-slate-400 font-bold mb-1">Next Payment Due Date</label>
              <input type="date" id="newDueDate" class="w-full p-2.5 rounded-lg bg-slate-900 border border-slate-700 text-white" required>
            </div>
            <div class="sm:col-span-2">
              <button type="submit" id="saveLoanBtn" class="w-full py-3 bg-blue-600 hover:bg-blue-500 font-extrabold text-white rounded-lg transition tracking-wide">
                CREATE & SAVE TO FIREBASE
              </button>
            </div>
          </form>
        </div>
      </div>

      <!-- LOAN LIST -->
      <div class="admin-card p-6 rounded-2xl shadow-xl">
        <h3 class="text-sm font-extrabold text-white uppercase tracking-wider mb-4 flex items-center gap-2">
          <i class="fa-solid fa-list-check text-blue-400"></i> Cloud Registered Loans
        </h3>
        <div class="overflow-x-auto">
          <table class="w-full text-left text-xs">
            <thead class="bg-slate-900 text-slate-400 uppercase">
              <tr>
                <th class="p-3">Loan ID</th>
                <th class="p-3">Code</th>
                <th class="p-3">Customer</th>
                <th class="p-3">Payable</th>
                <th class="p-3">Paid</th>
                <th class="p-3">Remaining</th>
                <th class="p-3 text-right">Actions</th>
              </tr>
            </thead>
            <tbody id="adminLoanTable" class="divide-y divide-slate-800"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAJt6q0qq0w2wy-MxhNXuRvL4MaDvPhLTQ",
      authDomain: "loansystem-6b088.firebaseapp.com",
      projectId: "loansystem-6b088",
      storageBucket: "loansystem-6b088.firebasestorage.app",
      messagingSenderId: "734622223465",
      appId: "1:734622223465:web:1f5b49334d6ae50cada6f8"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();
    const CORRECT_ADMIN_PASS = "admin100";

    function logActivity(msg, isError = false) {
      const c = document.getElementById('activityLogContainer');
      const item = document.createElement('div');
      const timeStr = new Date().toLocaleTimeString();
      if(isError) {
        item.className = "text-rose-400 font-bold bg-rose-500/10 p-1 rounded border border-rose-500/20";
        item.innerText = `[${timeStr}] ERROR: ${msg}`;
      } else {
        item.className = "text-emerald-400";
        item.innerText = `[${timeStr}] SUCCESS: ${msg}`;
      }
      c.prepend(item);
      document.getElementById('logSection').scrollIntoView({ behavior: 'smooth' });
    }

    function clearLogs() {
      document.getElementById('activityLogContainer').innerHTML = '<div class="text-slate-500">[System] Logs cleared.</div>';
    }

    function handleAdminLogin(e) {
      e.preventDefault();
      if(document.getElementById('adminUser').value.trim() === 'admin' && document.getElementById('adminPass').value.trim() === CORRECT_ADMIN_PASS) {
        document.getElementById('adminLoginSection').classList.add('hidden');
        document.getElementById('adminDashboard').classList.remove('hidden');
        logActivity("Admin logged into panel successfully.");
        loadAdminData();
      } else {
        document.getElementById('loginError').classList.remove('hidden');
        logActivity("Failed login attempt with incorrect password.", true);
      }
    }

    function adminLogout() {
      document.getElementById('adminDashboard').classList.add('hidden');
      document.getElementById('adminLoginSection').classList.remove('hidden');
      document.getElementById('adminPass').value = '';
    }

    async function loadAdminData() {
      try {
        logActivity("Fetching settings from Firestore...");
        const accDoc = await db.collection('settings').doc('accounts').get();
        if (accDoc.exists) {
          const acc = accDoc.data();
          document.getElementById('accEasyPaisa').value = acc.easypaisa || '';
          document.getElementById('accJazzCash').value = acc.jazzcash || '';
          document.getElementById('accSadaPay').value = acc.sadapay || '';
        }
      } catch (e) {
        logActivity("Failed to load accounts: " + e.message, true);
      }

      try {
        logActivity("Fetching loans collection from Firestore...");
        const snapshot = await db.collection('loans').get();
        const tbody = document.getElementById('adminLoanTable');
        tbody.innerHTML = '';

        if (snapshot.empty) {
          tbody.innerHTML = `<tr><td colspan="7" class="p-4 text-center text-slate-500">No records found in cloud database.</td></tr>`;
          logActivity("Connected to Firestore successfully (Zero loan records found).");
          return;
        }

        snapshot.forEach(docSnap => {
          const l = docSnap.data();
          const docId = docSnap.id;
          const rem = l.payableAmount - l.paidAmount;
          tbody.innerHTML += `
            <tr class="hover:bg-slate-800/50">
              <td class="p-3 font-mono font-bold text-blue-400">${l.loanId}</td>
              <td class="p-3 font-mono font-extrabold text-amber-400">${l.code}</td>
              <td class="p-3 font-bold text-white">${l.customerName}</td>
              <td class="p-3 font-bold text-slate-300">Rs. ${l.payableAmount.toLocaleString()}</td>
              <td class="p-3 font-bold text-emerald-400">Rs. ${l.paidAmount.toLocaleString()}</td>
              <td class="p-3 font-bold text-rose-400">Rs. ${rem.toLocaleString()}</td>
              <td class="p-3 text-right space-x-2">
                <button onclick="addPayment('${docId}', ${l.paidAmount}, '${l.customerName}')" class="px-2 py-1 bg-emerald-600/30 text-emerald-300 border border-emerald-500/40 rounded text-[11px] font-bold hover:bg-emerald-600 hover:text-white">+ Pay</button>
                <button onclick="deleteLoan('${docId}', '${l.customerName}')" class="px-2 py-1 bg-red-600/30 text-red-300 border border-red-500/40 rounded text-[11px] font-bold hover:bg-red-600/30">Del</button>
              </td>
            </tr>`;
        });
        logActivity(`Successfully loaded ${snapshot.size} loan records.`);
      } catch (err) {
        logActivity("Firestore Connection Error: " + err.message, true);
      }
    }

    async function saveAccounts(e) {
      e.preventDefault();
      const btn = document.getElementById('saveAccBtn');
      btn.innerText = "Saving...";
      btn.disabled = true;
      try {
        await db.collection('settings').doc('accounts').set({
          easypaisa: document.getElementById('accEasyPaisa').value,
          jazzcash: document.getElementById('accJazzCash').value,
          sadapay: document.getElementById('accSadaPay').value
        });
        logActivity("Payment numbers saved successfully.");
        alert('Accounts saved successfully!');
      } catch(err) {
        logActivity("Failed to save accounts: " + err.message, true);
        alert('Error: ' + err.message);
      } finally {
        btn.innerText = "Save Numbers";
        btn.disabled = false;
      }
    }

    async function addLoanRecord(e) {
      e.preventDefault();
      const btn = document.getElementById('saveLoanBtn');
      btn.innerText = "Saving to Firebase Cloud...";
      btn.disabled = true;

      const custName = document.getElementById('newCustName').value.trim();
      const newLoan = {
        loanId: 'LCN-' + Math.floor(1000 + Math.random() * 9000),
        code: document.getElementById('newCustCode').value.trim(),
        customerName: custName,
        totalLoan: parseFloat(document.getElementById('newLoanAmt').value),
        payableAmount: parseFloat(document.getElementById('newPayableAmt').value),
        paidAmount: 0,
        approvalDate: document.getElementById('newAppDate').value,
        nextDueDate: document.getElementById('newDueDate').value,
        status: 'Active',
        installments: []
      };

      try {
        logActivity(`Sending loan data for [${custName}] to Firebase...`);
        await db.collection('loans').add(newLoan);
        logActivity(`Successfully saved loan record for ${custName}!`);
        alert('Loan successfully saved to cloud database!');
        loadAdminData();
        e.target.reset();
      } catch (err) {
        logActivity(`Firebase Write Error: ${err.message}`, true);
        alert('Firebase Error: ' + err.message);
      } finally {
        btn.innerText = "CREATE & SAVE TO FIREBASE";
        btn.disabled = false;
      }
    }

    async function addPayment(docId, currentPaid, custName) {
      const amount = prompt("Enter payment amount collected (PKR):");
      if (amount && !isNaN(amount)) {
        try {
          const payVal = parseFloat(amount);
          logActivity(`Adding payment of Rs. ${payVal} for ${custName}...`);
          const docRef = db.collection('loans').doc(docId);
          const docSnap = await docRef.get();
          const installments = docSnap.data().installments || [];
          
          installments.push({
            num: installments.length + 1,
            dueDate: new Date().toISOString().split('T')[0],
            amount: payVal,
            paidDate: new Date().toISOString().split('T')[0],
            status: 'PAID'
          });

          await docRef.update({
            paidAmount: currentPaid + payVal,
            installments: installments
          });

          logActivity(`Payment recorded for ${custName}.`);
          alert("Payment recorded successfully!");
          loadAdminData();
        } catch(err) {
          logActivity("Payment error: " + err.message, true);
          alert("Error: " + err.message);
        }
      }
    }

    async function deleteLoan(docId, custName) {
      if (confirm(`Are you sure you want to delete loan record for ${custName}?`)) {
        try {
          logActivity(`Deleting loan record [${custName}]...`);
          await db.collection('loans').doc(docId).delete();
          logActivity(`Loan record deleted.`);
          alert("Loan record deleted.");
          loadAdminData();
        } catch(err) {
          logActivity("Delete error: " + err.message, true);
          alert("Error: " + err.message);
        }
      }
    }
  </script>
</body>
</html>
